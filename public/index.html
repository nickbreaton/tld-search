<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sandwich?</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(32rem, calc(100% - 2rem));
      }
      label,
      input,
      #result {
        display: block;
        width: 100%;
        box-sizing: border-box;
      }
      label {
        margin-bottom: 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
      }
      input {
        padding: 0.8rem 1rem;
        font: inherit;
      }
      #result {
        min-height: 2rem;
        margin-top: 1rem;
        font-size: 1.25rem;
      }
      ol {
        margin: 1rem 0 0;
        padding: 0;
        list-style: none;
      }
      li {
        min-height: 4rem;
        margin-bottom: 1rem;
      }
      .tweet-fallback {
        display: block;
        padding: 1rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="account"><a href="/auth/x">Sign in with X</a></p>
      <form id="search-form" role="search">
        <label for="search">Search your bookmarks</label>
        <input
          id="search"
          name="q"
          type="search"
          placeholder="typography resources"
          autocomplete="off"
          required
        />
      </form>
      <section id="result" aria-live="polite"></section>
    </main>
    <script type="module">
      const account = document.querySelector("#account");
      const form = document.querySelector("#search-form");
      const input = document.querySelector("#search");
      const result = document.querySelector("#result");

      let twitterWidgetsPromise;

      const loadTwitterWidgets = () => {
        if (globalThis.twttr?.widgets) {
          return Promise.resolve(globalThis.twttr.widgets);
        }

        if (!twitterWidgetsPromise) {
          twitterWidgetsPromise = new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = "https://platform.twitter.com/widgets.js";
            script.async = true;
            script.onload = () => resolve(globalThis.twttr.widgets);
            script.onerror = () => reject(new Error("Loading X embeds failed."));
            document.head.append(script);
          });
        }

        return twitterWidgetsPromise;
      };

      const loadAccount = async () => {
        try {
          const response = await fetch("/api/me");

          const body = await response.json();

          if (!response.ok) {
            console.error("Loading the account failed:", response.status, body.error);
            return;
          }

          account.textContent = `Signed in as @${body.username}`;
        } catch (error) {
          console.error("Loading the account failed:", error);
        }
      };

      void loadAccount();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "Searching…";

        try {
          const response = await fetch(`/api/search?q=${encodeURIComponent(input.value)}`);
          const body = await response.json();

          if (!response.ok) {
            throw new Error(body.error ?? "Search failed.");
          }

          const results = body.results ?? [];

          if (results.length === 0) {
            result.textContent = "No bookmarks found.";
            return;
          }

          const list = document.createElement("ol");
          const items = [...results]
            .sort((a, b) => b.relevance - a.relevance)
            .slice(0, 10)
            .map(({ id }) => {
              const item = document.createElement("li");
              list.append(item);
              return { id, item };
            });

          result.replaceChildren(list);

          const widgets = await loadTwitterWidgets();

          for (const { id, item } of items) {
            const tweet = await widgets.createTweet(id, item, {
              align: "center",
              dnt: true,
            });

            if (!tweet) {
              const link = document.createElement("a");
              link.className = "tweet-fallback";
              link.href = `https://x.com/i/status/${encodeURIComponent(id)}`;
              link.textContent = "View this post on X";
              item.append(link);
            }
          }
        } catch (error) {
          result.textContent = error instanceof Error ? error.message : "Search failed.";
        }
      });
    </script>
  </body>
</html>
