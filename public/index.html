<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sandwich?</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(32rem, calc(100% - 2rem));
      }
      label,
      input,
      output {
        display: block;
        width: 100%;
        box-sizing: border-box;
      }
      label {
        margin-bottom: 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
      }
      input {
        padding: 0.8rem 1rem;
        font: inherit;
      }
      output {
        min-height: 2rem;
        margin-top: 1rem;
        font-size: 1.25rem;
      }
      ul {
        margin: 1rem 0 0;
        padding-left: 1.25rem;
      }
      li {
        margin-bottom: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="account"><a href="/auth/x">Sign in with X</a></p>
      <form id="search-form" role="search">
        <label for="search">Search your bookmarks</label>
        <input
          id="search"
          name="q"
          type="search"
          placeholder="typography resources"
          autocomplete="off"
          required
        />
      </form>
      <output id="result" for="search" aria-live="polite"></output>
    </main>
    <script type="module">
      const account = document.querySelector("#account");
      const form = document.querySelector("#search-form");
      const input = document.querySelector("#search");
      const result = document.querySelector("#result");

      const loadAccount = async () => {
        try {
          const response = await fetch("/api/me");

          const body = await response.json();

          if (!response.ok) {
            console.error("Loading the account failed:", response.status, body.error);
            return;
          }

          account.textContent = `Signed in as @${body.username}`;
        } catch (error) {
          console.error("Loading the account failed:", error);
        }
      };

      void loadAccount();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "Searching…";

        try {
          const response = await fetch(`/api/search?q=${encodeURIComponent(input.value)}`);
          const body = await response.json();

          if (!response.ok) {
            throw new Error(body.error ?? "Search failed.");
          }

          const results = body.results ?? [];

          if (results.length === 0) {
            result.textContent = "No bookmarks found.";
            return;
          }

          const list = document.createElement("ul");

          for (const { text, relevance } of results) {
            const item = document.createElement("li");
            item.textContent = `${text} (${(relevance * 100).toFixed(0)}%)`;
            list.append(item);
          }

          result.replaceChildren(list);
        } catch (error) {
          result.textContent = error instanceof Error ? error.message : "Search failed.";
        }
      });
    </script>
  </body>
</html>
